name: Verify Windows application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Prepare pinned FFmpeg
        shell: powershell
        run: ./scripts/fetch-media.ps1 -SevenZip 'C:/Program Files/7-Zip/7z.exe'
      - run: npm run test:media
      - run: npm run test:smoke
      - run: npm run build
      - name: Verify packaged assets
        run: npm run test:smoke -- dist/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            dist/smoke/*.json
            dist/import-smoke/*.json
